name: Agent Review tests
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_public.py --tracked
      - run: python scripts/review.py virtual-prepare --help
      - run: python scripts/review.py virtual-execute --help
      - run: python scripts/review.py virtual-collect --help
